apiVersion: v1
data:
  config.conf: |
    apiVersion: kubeproxy.config.k8s.io/v1alpha1
    kind: KubeProxyConfiguration
    detectLocalMode: NodeCIDR
    mode: nftables
    clientConnection:
      kubeconfig: /var/lib/kubeconfig
    nftables:
      masqueradeAll: true
    conntrack:
      maxPerCore: 0
    featureGates:
      AllAlpha: false
kind: ConfigMap
metadata:
  labels:
    app: kube-proxy
    k8s-app: kube-proxy
  name: kube-proxy
  namespace: kube-proxy
